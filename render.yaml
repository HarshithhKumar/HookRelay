services:
  - type: web
    name: linkplease-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PSEUDOGRAM_BASE_URL
        value: "https://pseudogram-api.onrender.com"
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      # Worker tuning options (optional defaults; can be overridden in Render dashboard)
      - key: DM_WORKER_MAX_ATTEMPTS
        value: "5"
      - key: DM_WORKER_RETRY_BASE_SECONDS
        value: "30"
      - key: DM_WORKER_SENDING_LEASE_SECONDS
        value: "120"

# Managed PostgreSQL database for production
databases:
  - name: linkplease-db
    plan: starter
    region: oregon

# Note: DM worker and reconciliation are started inside the web process on startup.
# Do NOT create separate worker services for the free Render plan; a single web
# service plus the managed Postgres DB is sufficient for the verified architecture.
# Run migrations on deploy (Render will run this as a post-deploy hook if supported)
# It's recommended to configure a 'releaseCommand' on the web service in the Render UI:
# cd backend && python -c "from alembic.config import Config; from alembic import command; cfg = Config('alembic.ini'); command.upgrade(cfg, 'head')"
